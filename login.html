<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wydad AC | Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="scene" id="scene">

    <!-- Light cone (behind everything) -->
    <div class="light-beam" aria-hidden="true"></div>

    <!-- Hanging lamp: click it (or the button) to switch the light -->
    <button type="button" class="lamp" id="lamp" aria-label="Turn the light on" aria-pressed="false">
      <span class="lamp-cord"></span>
      <span class="lamp-cap"></span>
      <span class="lamp-shade"></span>
      <span class="bulb"></span>
      <span class="lamp-chain"><i></i></span>
    </button>

    <p class="hint" id="hint">Click the lamp to turn on the light</p>

    <!-- Login card: hidden until the light is on -->
    <div class="card-wrap">
      <div class="card-inner">
        <section class="login-card" id="loginCard" inert>
          <!-- Left: club panel -->

            <aside class="brand-panel">
                <div class="crest"aria-hidden="true">W<span>A</span>C</div>
                <div class="ball-stage" id="ballstage"aria-hidden=true>
                    <div class="showckave"></div>
                    <svg class="ball"id="ball"viewbox="0 0 100 100"></svg>
                    <defs>
                        <radialgradient id="ballgrad"cx="35%" cy="30%" r="75%"></radialgradient>
                        
                    <stop offset="0" stop-color="#ffffff"/>
                    <stop offset=".55" stop-color="#e4e4e4"/>
                    <stop offset="1" stop-color="#8a8a8a"/>
                  </radialGradient>
                                    <clipPath id="ballClip"><circle cx="50" cy="50" r="46"/></clipPath>
                  <path id="pent" d="M0,-11 L10.5,-3.4 L6.5,8.9 L-6.5,8.9 L-10.5,-3.4 Z"/>
                </defs>
                <circle cx="50" cy="50" r="46" fill="url(#ballGrad)"/>
                <g clip-path="url(#ballClip)">
                  <g fill="#151515">
                    <use href="#pent" transform="translate(50,50) scale(1.15)"/>
                    <use href="#pent" transform="translate(50,3) rotate(180) scale(1.15)"/>
                    <use href="#pent" transform="translate(95,36) rotate(252) scale(1.15)"/>
                    <use href="#pent" transform="translate(78,92) rotate(324) scale(1.15)"/>
                    <use href="#pent" transform="translate(22,92) rotate(36) scale(1.15)"/>
                    <use href="#pent" transform="translate(5,36) rotate(108) scale(1.15)"/>
                     </g>
                          <g stroke="#151515" stroke-width="1.5" stroke-linecap="round" fill="none">
                    <path d="M50 38 L50 13"/><path d="M62.5 47 L84 40"/><path d="M57.5 61 L70 80"/>
                    <path d="M42.5 61 L30 80"/><path d="M37.5 47 L16 40"/>
                  </g>
                </g>
                    <ellipse cx="36" cy="27" rx="16" ry="9" fill="#fff" opacity=".35" transform="rotate(-30 36 27)"/>
                <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1"/>
                <g class="cracks" clip-path="url(#ballClip)" fill="none" stroke="#e10613" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M52 6 L46 28 L57 42 L44 58 L53 73 L47 94"/>
                  <path d="M57 42 L76 49 L86 64"/>
                  <path d="M44 58 L24 62"/>
                </g>
              </svg>
              <div class="ball-shadow"></div>
              <div class="attempts" id="attempts" role="img" aria-label="2 attempts left"><i></i><i></i></div>
            </div>
            <div class="brand-copy">
              <p class="eyebrow">Pride of Casablanca</p>
              <h2 class="brand-title">DIMA<br>WYDAD</h2>
            </div>
            <ul class="club-stats">
              <li><b>1937</b><span>Founded</span></li>
              <li><b>22</b><span>Botola Pro titles</span></li>
              <li><b>3</b><span>CAF Champions League</span></li>
            </ul>
          </aside>
           <!-- Right: sign in -->
            

                    </defs>
                </div>
            </aside>
