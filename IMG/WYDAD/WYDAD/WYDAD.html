<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Wydad Athletic Club</title>

    <link rel="stylesheet" href="WYDAD.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            <img class="logo-img"
            src="https://images.seeklogo.com/logo-png/43/3/wydad-athletic-club-2022-logo-png_seeklogo-438990.png">

            <div>

                <h1>WYDAD</h1>

                <span>ATHLETIC CLUB</span>

            </div>

        </div>

        <!-- NAVBAR -->

        <nav>

            <a href="#">HOME</a>

            <a href="#">NEWS</a>

            <a href="#">TEAM</a>

            <a href="#">MATCHES</a>

            <a href="#">CONTACT</a>

        </nav>

    </header>

    <!-- HERO SECTION -->

    <section class="hero">

        <div class="hero-box">

            <img src="IMG/images.jfif">

            <p class="small-text">

                WYDAD ATHLETIC CLUB

            </p>

            <h2>

                <span class="white">

                    PRIDE OF

                </span>

                <br>

                <span class="red">

                    CASABLANCA

                </span>

            </h2>

            <a href="#titles" class="btn">

                CLICK HERE

            </a>

        </div>

    </section>

    <!-- TITLES SECTION -->

    <section class="titles" id="titles">

        <h2 class="titles-main">

            WYDAD TROPHIES

        </h2>

        <div class="titles-container">

            <!-- BOTOLA -->

            <div class="title-box">

                <img src="IMG/botola.jpg">

                <h3>BOTOLA PRO</h3>

                <p>22 TITLES</p>

            </div>

            <!-- CHAMPIONS LEAGUE -->

            <div class="title-box">

                <img src="IMG/champions.jpg">

                <h3>CAF CHAMPIONS LEAGUE</h3>

                <p>3 TITLES</p>

            </div>

            <!-- THRONE CUP -->

            <div class="title-box">

                <img src="IMG/throne.jpg">

                <h3>THRONE CUP</h3>

                <p>9 TITLES</p>

            </div>

            <!-- SUPER CUP -->

            <div class="title-box">

                <img src="IMG/supercup.jpg">

                <h3>CAF SUPER CUP</h3>

                <p>1 TITLE</p>

            </div>

        </div>

    </section>

    <!-- SCRIPT -->

    <script src="WYDAD.js"></script>

</body>

</html>
